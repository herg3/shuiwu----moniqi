<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:512px;height:512px;overflow:hidden;}
.bg{width:512px;height:512px;
    background:linear-gradient(150deg,#1568D8 0%,#1D7FEA 38%,#38A2F6 72%,#5FC0FB 100%);}
</style></head><body>
<div class="bg">
  <svg width="512" height="512" viewBox="0 0 512 512">
    <!-- 盾牌：肩宽 63%，从 10% 到 70% 高 -->
    <path d="M256 54 L418 108 V248 C418 310 344 352 256 372 C168 352 94 310 94 248 V108 Z"
          fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 税：盾牌内居中，约占盾宽 46% -->
    <text x="256" y="250" text-anchor="middle"
          font-family="Noto Sans SC, Microsoft YaHei, sans-serif"
          font-size="148" font-weight="700" fill="#FFFFFF">税</text>
    <!-- 底部两行：78% / 89% -->
    <text x="256" y="412" text-anchor="middle"
          font-family="Noto Sans SC, Microsoft YaHei, sans-serif"
          font-size="33" font-weight="700" fill="#FFFFFF" letter-spacing="1">国家税务总局</text>
    <text x="256" y="458" text-anchor="middle"
          font-family="Noto Sans SC, Microsoft YaHei, sans-serif"
          font-size="33" font-weight="700" fill="#FFFFFF" letter-spacing="1">发布</text>
  </svg>
</div>
</body></html>
